# SPDX-License-Identifier: MIT
name: Replay
on:
  push:
  pull_request:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check SHA256SUMS
        run: sha256sum -c SHA256SUMS
      - name: Install pinned packages
        run: python -m pip install -r requirements.txt
      - name: Replay (assertions active; exact certificate and edge list compared byte for byte)
        run: python -B -I code/reproduce.py --out "$RUNNER_TEMP/out"
      - name: Semantic negative controls
        run: python -B -O negative_controls.py
      - name: Working tree unchanged
        run: git status --porcelain && test -z "$(git status --porcelain)"
